name: CI

# Runs on every push to main (the owner's choice: pull requests are not built by CI; build and test
# locally before merging). "Run workflow" in the Actions tab runs it on any branch by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version is valid and not behind the last release
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = ($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if ($v -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { Write-Host "::error::<Version>$v</Version> is not MAJOR.MINOR.PATCH"; exit 1 }
          $last = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
          if ($last -and [version]$v -lt $last) { Write-Host "::error::Version $v is lower than the latest release v$last"; exit 1 }
          Write-Host "Version $v (latest release: $(if ($last) { "v$last" } else { 'none' }))"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StillSaneExile.sln
      - run: dotnet build StillSaneExile.sln -c Release --no-restore
      - run: dotnet test StillSaneExile.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  # Packaging problems used to surface only when a release tag was pushed. On every push to main this
  # packs the installer with the same script the Release workflow uses, into the runner's temp folder,
  # uploads nothing, then starts the packed app once (unattended, rendering the demo screens) to prove it runs.
  pack:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes fall back to commit subjects since the last tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Release notes
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = ($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          ./scripts/release-notes.ps1 -Version $v -OutFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Publish and pack (nothing is published)
        shell: pwsh
        run: ./scripts/pack-local.ps1 -PublishDir "$env:RUNNER_TEMP/publish" -OutDir "$env:RUNNER_TEMP/releases" -ReleaseNotes "$env:RUNNER_TEMP/release-notes.md"

      - name: Start the packed app
        shell: pwsh
        run: ./scripts/smoke-packed.ps1 -PackDir "$env:RUNNER_TEMP/releases" -WorkDir "$env:RUNNER_TEMP/smoke"
