name: Release

# A release is a tag vX.Y.Z on main whose version equals <Version> in Directory.Build.props and is
# higher than the previous release (scripts/verify-release.ps1). The run builds, tests, packs the
# installer with Velopack and publishes a GitHub release. Installed copies update from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACK_ID: StillSaneExile

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release rules
        id: version
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Tag '${{ github.ref_name }}'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore StillSaneExile.sln
          dotnet build StillSaneExile.sln -c Release --no-restore
          dotnet test StillSaneExile.sln -c Release --no-build

      - name: Restore vpk
        run: dotnet tool restore

      - name: Fetch previous release (for delta updates)
        continue-on-error: true
        shell: pwsh
        run: dotnet vpk download github --repoUrl '${{ github.server_url }}/${{ github.repository }}' --token '${{ secrets.GITHUB_TOKEN }}' --outputDir releases

      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version '${{ steps.version.outputs.version }}' -OutFile release-notes.md

      # The same script the CI pack check runs on every pull request: publish self-contained, then vpk pack.
      - name: Publish and pack installer
        shell: pwsh
        run: ./scripts/pack-local.ps1 -Version '${{ steps.version.outputs.version }}' -PackId $env:PACK_ID -PublishDir publish -OutDir releases -ReleaseNotes release-notes.md

      - name: Start the packed app
        shell: pwsh
        run: ./scripts/smoke-packed.ps1 -PackDir releases -PackId $env:PACK_ID -WorkDir "$env:RUNNER_TEMP/smoke"

      - name: Publish GitHub release
        shell: pwsh
        run: >
          dotnet vpk upload github --repoUrl '${{ github.server_url }}/${{ github.repository }}' --token '${{ secrets.GITHUB_TOKEN }}'
          --outputDir releases --publish --tag '${{ github.ref_name }}' --releaseName 'Still Sane, Exile? ${{ github.ref_name }}'
