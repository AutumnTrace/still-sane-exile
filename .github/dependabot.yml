version: 2
updates:
  # NuGet packages in every project of the solution, and the vpk tool in dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The Velopack library and the vpk packer must stay on the same version: one pull request for both.
      velopack:
        patterns:
          - Velopack
          - vpk
      test-tools:
        patterns:
          - Microsoft.NET.Test.Sdk
          - xunit*
          - coverlet.*
    ignore:
      # Runtime-coupled packages follow the .NET major (Microsoft.Data.Sqlite 11.x targets .NET 11).
      # Major bumps come with the TargetFramework change, by hand.
      - dependency-name: Microsoft.Data.Sqlite*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: System.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
